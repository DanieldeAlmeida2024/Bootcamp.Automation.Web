<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Laboratório Cypress</title>
</head>
<body>
  <main>
    <h1>Login de demonstração</h1>
    <p>Apenas dados fictícios. Esta página não autentica usuários reais.</p>
    <form id="login" novalidate>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="off" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="off" required>
      <button type="submit">Entrar</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById('login').addEventListener('submit', (evento) => {
      evento.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const sucesso = email === 'aluno@example.test' && senha === 'senha-sintetica';
      const status = document.getElementById('status');
      status.dataset.resultado = sucesso ? 'sucesso' : 'falha';
      status.textContent = sucesso ? 'Login de demonstração concluído' : 'Credenciais inválidas';
    });
  </script>
</body>
</html>
